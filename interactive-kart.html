<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Kart</title>

    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="login-page-body">

    <div class="hero-bg">
        <span class="streak"></span>
        <span class="streak"></span>
        <span class="streak"></span>

        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
    </div>

    <nav class="navbar">

        <div class="nav-container">

            <a href="index.html#home" class="logo">

                <div class="logo-icon">
                    <img id="logo"
                         src="logo.jpg"
                         alt="logo"
                         width="50"
                         height="50">
                </div>

                <div class="logo-text">

                    <span class="logo-title">
                        TRYDAN
                    </span>

                    <span class="logo-subtitle">
                        NMIT Racing
                    </span>

                </div>

            </a>

        </div>

    </nav>

    <div class="interactive-container">

        <h1 class="hero-title">

            <span class="title-green">
                INTERACTIVE
            </span>

            <span class="title-white">
                KART
            </span>

        </h1>

        <p class="kart-intro">

            Hover over any subsystem to see its name.
            Click to open the technical page.

        </p>

        <div class="kart-model">

            <img src="images/kart-side.png"
                 class="kart-image">

            <a href="subsystems/engine.html" class="hotspot engine">

    
                <span class="dot"></span>

    
                <span class="subsystem-name">
    
                    Engine
    
                </span>


            </a>
            <a href="subsystems/chassis.html" class="hotspot chassis">

    <span class="dot"></span>

    <span class="subsystem-name">
        Chassis
    </span>

</a>

            <a href="subsystems/steering.html" class="hotspot steering">

    <span class="dot"></span>

    <span class="subsystem-name">
        Steering
    </span>

</a>
        </div>

    </div>

</body>

</html>
